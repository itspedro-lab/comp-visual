<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>Canvas exercicio 4 aula 4</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    canvas {
      border: 1px solid black;
      display: block;
      margin-bottom: 20px;
    }

    .controles {
      display: flex;
      flex-direction: column;
      gap: 10px;

      width: 400px;
    }
  </style>
</head>

<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <div class="controles">
    <label>
      Velocidade:
      <input type="range" id="speed" min="10" max="1000" value="100">

      <span id="speedValue">100 ms</span>
    </label>

    <label>
      Tamanho:

      <input type="range" id="size" min="5" max="100" value="20" step="5">

      <span id="sizeValue">20 px</span>
    </label>

    <label>
      Cor:

      <input type="color" id="color" value="#000000">
    </label>

    <label>
      Modo de cor:

      <select id="colorMode">
        <option value="random">
          Aleatória
        </option>

        <option value="fixed">
          Cor selecionada
        </option>
      </select>
    </label>

    <label>
      Funcionamento:

      <select id="mode">
        <option value="random">
          Posição aleatória
        </option>

        <option value="fill">
          Preencher completamente
        </option>
      </select>
    </label>

    <div>
      <input type="button" id="startButton" value="Iniciar">

      <input type="button" id="stopButton" value="Pausar">

      <input type="button" id="clearButton" value="Limpar">
    </div>

    <script src="script.js"></script>
</body>

</html>
