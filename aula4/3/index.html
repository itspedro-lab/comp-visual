<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>Canvas exercicio 3 aula 4</title>
    <style>
    canvas {
      border: 1px solid black;
      cursor: crosshair;
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <input type="color" id="color" value="#000000">

  <input
    type="range"
    id="size"
    min="1"
    max="30"
    value="5"
  >

  <button id="clearButton">Limpar</button>

  <script src="script.js"></script>
</body>
</html>
